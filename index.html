<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-LO Champs</title>

<!-- ROOT REDIRECT — clochamps.com/  ->  clochamps.com/play/
     The game itself now lives at /play/index.html. This file exists so that
     every old link still works: bookmarks, the legacy clogame.github.io URL,
     social posts, and above all the referral invites already shared as
     clochamps.com/?ref=UID — applyPendingReferral() reads ?ref= off the URL
     the GAME loads on, so the query string MUST survive the hop or those
     invites silently stop crediting.
     When the Play listing goes live, replace this file with the marketing
     landing page — and keep the ?ref= forwarding rule below in it. -->

<link rel="canonical" href="https://clochamps.com/play/">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e56d6">
<link rel="icon" href="/icon-192.png">

<script>
  // location.replace, not location.href: replacing the history entry stops the
  // browser Back button from bouncing the player root -> /play/ -> root forever.
  // search and hash are carried through verbatim.
  location.replace('/play/' + location.search + location.hash);
</script>

<style>
  html,body{height:100%;margin:0}
  body{
    background:#1e56d6;
    color:#f4e9c8;
    font:600 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  a{color:#fff}
</style>
</head>
<body>
  <noscript>
    <p>Loading C-LO Champs&hellip;<br>
    <a href="/play/">Tap here to play</a></p>
  </noscript>
</body>
</html>
